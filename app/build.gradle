plugins {
    id 'com.android.application'
}

android {
    namespace 'com.laczek.whatsapptoolkit'
    compileSdk 35

    signingConfigs {
        release {
            def storePath = System.getenv('RELEASE_STORE_FILE')
            if (storePath != null && !storePath.isBlank()) {
                storeFile file(storePath)
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // CI supplies a signing key for a directly installable release APK.
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    defaultConfig {
        applicationId 'com.laczek.whatsapptoolkit'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName System.getenv('APP_VERSION') ?: '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
